<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>د زده کونکو مدیریت سیستم</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🎓 د زده کونکو مدیریت سیستم</h1>
        <p>د مکتب زده کونکي اضافه، ایډیټ او حذف کړئ</p>
    </header>

    <!-- فورمه: اضافه کول / ایډیټ کول -->
    <section class="form-card">
        <h2 id="form-title">➕ نوی زده کونکی اضافه کړئ</h2>
        <form id="student-form">
            <input type="hidden" id="student-id">

            <div class="form-row">
                <div class="form-group">
                    <label for="full_name">بشپړ نوم *</label>
                    <input type="text" id="full_name" required placeholder="د زده کونکي نوم">
                </div>
                <div class="form-group">
                    <label for="father_name">د پلار نوم</label>
                    <input type="text" id="father_name" placeholder="د پلار نوم">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="class_name">ټولګی</label>
                    <input type="text" id="class_name" placeholder="لکه: نهم">
                </div>
                <div class="form-group">
                    <label for="age">عمر</label>
                    <input type="number" id="age" placeholder="عمر">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone">د تلیفون شمیره</label>
                    <input type="text" id="phone" placeholder="07xxxxxxxx">
                </div>
                <div class="form-group">
                    <label for="address">پته</label>
                    <input type="text" id="address" placeholder="اوسیدنځای">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" id="submit-btn" class="btn btn-primary">زده کونکی اضافه کړئ</button>
                <button type="button" id="cancel-btn" class="btn btn-secondary" style="display:none;">لغوه کول</button>
            </div>
        </form>
    </section>

    <!-- د زده کونکو جدول -->
    <section class="table-card">
        <div class="table-header">
            <h2>📋 د زده کونکو لست</h2>
            <input type="text" id="search-box" placeholder="🔍 د نوم په اساس لټون...">
        </div>
        <div class="table-wrap">
            <table id="students-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>بشپړ نوم</th>
                        <th>د پلار نوم</th>
                        <th>ټولګی</th>
                        <th>عمر</th>
                        <th>تلیفون</th>
                        <th>پته</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="students-tbody">
                    <!-- JS به دلته ډاټا واچوي -->
                </tbody>
            </table>
            <p id="empty-msg" style="display:none;">هیڅ زده کونکی نشته. لومړی یو زده کونکی اضافه کړئ.</p>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
